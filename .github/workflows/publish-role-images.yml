name: Publish role images

# Protected-main review is the release gate. CI publishes the exact
# platform-to-digest map, authenticated by GitHub build provenance.
on:
  push:
    branches: [main]

env:
  RELAY_COMMIT: ${{ github.sha }}
  RELEASE_TAG: role-images-${{ github.sha }}

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  launchers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build native launchers
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$RELAY_COMMIT"
          mkdir -p "$RUNNER_TEMP/launchers"
          for os in darwin linux; do
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -buildvcs=true \
                -ldflags="-buildid= -X main.releaseCommit=$RELAY_COMMIT" -o "$RUNNER_TEMP/launchers/relay-$os-$arch" ./cmd/relay
            done
          done
          cp scripts/install-launcher.sh "$RUNNER_TEMP/launchers/"
          cd "$RUNNER_TEMP/launchers"
          sha256sum relay-* > launcher-checksums.sha256
      - name: Attest launcher assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ runner.temp }}/launchers/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-launchers
          path: ${{ runner.temp }}/launchers/
          if-no-files-found: error
  build:
    name: ${{ matrix.target }} / ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLATFORM_ARTIFACT_NAME: ${{ matrix.platform == 'linux/amd64' && 'linux-amd64' || 'linux-arm64' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        target: [online, offline, contributor]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify protected-main release inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$RELAY_COMMIT"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Read protected-main release image inputs
        id: inputs
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          jq -e '
            .schema == "relay-role-image-inputs/v1" and
            (.aws_cli_image | test("^[^[:space:]@]+@sha256:[0-9a-f]{64}$")) and
            (.mpc.linux_amd64.url | test("^https://")) and
            (.mpc.linux_amd64.sha256 | test("^[0-9a-f]{64}$")) and
            (.mpc.linux_arm64.url | test("^https://")) and
            (.mpc.linux_arm64.sha256 | test("^[0-9a-f]{64}$"))
          ' release/role-images.json >/dev/null
          case "$PLATFORM" in
            linux/amd64) key=linux_amd64 ;;
            linux/arm64) key=linux_arm64 ;;
            *) exit 1 ;;
          esac
          printf 'mpc_url=%s\nmpc_sha256=%s\naws_cli_image=%s\n' \
            "$(jq -r ".mpc.$key.url" release/role-images.json)" \
            "$(jq -r ".mpc.$key.sha256" release/role-images.json)" \
            "$(jq -r '.aws_cli_image' release/role-images.json)" >> "$GITHUB_OUTPUT"

      - name: Stage exact architecture inputs
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          MPC_URL: ${{ steps.inputs.outputs.mpc_url }}
          MPC_SHA256: ${{ steps.inputs.outputs.mpc_sha256 }}
        run: |
          set -euo pipefail
          [[ "$MPC_URL" =~ ^https:// ]] && [[ "$MPC_SHA256" =~ ^[0-9a-f]{64}$ ]]
          mkdir image-context
          GOOS=linux GOARCH="${PLATFORM#linux/}" CGO_ENABLED=0 \
            go build -trimpath -buildvcs=true -ldflags=-buildid= -o image-context/relay ./cmd/relay
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error "$MPC_URL" \
            --output image-context/mpc-ceremony
          printf '%s  %s\n' "$MPC_SHA256" image-context/mpc-ceremony | sha256sum --check --strict
          chmod 0555 image-context/relay image-context/mpc-ceremony
          cp docker/roles/Dockerfile image-context/roles.Dockerfile
          cp docker/ceremony-tool/Dockerfile image-context/contributor.Dockerfile

      - name: Select image name
        id: image
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ env.RELAY_COMMIT }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            online) name=ghcr.io/${{ github.repository }}/relay-role-online; file=roles.Dockerfile; target=online ;;
            offline) name=ghcr.io/${{ github.repository }}/relay-role-offline; file=roles.Dockerfile; target=offline ;;
            contributor) name=ghcr.io/${{ github.repository }}/relay-ceremony-tool; file=contributor.Dockerfile; target= ;;
            *) exit 1 ;;
          esac
          suffix=${PLATFORM#linux/}
          printf 'name=%s\nfile=%s\ntarget=%s\ntag=%s-%s\n' "$name" "$file" "$target" "$TAG" "$suffix" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable release image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: image-context
          file: image-context/${{ steps.image.outputs.file }}
          target: ${{ steps.image.outputs.target }}
          platforms: ${{ matrix.platform }}
          push: true
          pull: true
          build-args: |
            AWS_CLI_IMAGE=${{ steps.inputs.outputs.aws_cli_image }}
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}

      - name: Attest published image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Write release record
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT: ${{ env.RELAY_COMMIT }}
        run: |
          set -euo pipefail
          mkdir candidate
          jq -n --arg target "$TARGET" --arg platform "$PLATFORM" --arg image "$IMAGE" \
            --arg digest "$DIGEST" --arg commit "$COMMIT" \
            '{target:$target, platform:$platform, image:($image+"@"+$digest), source_commit:$commit}' \
            > "candidate/$TARGET-${PLATFORM#linux/}.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}-${{ env.PLATFORM_ARTIFACT_NAME }}
          path: candidate/
          if-no-files-found: error
          retention-days: 90

  docker-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: release-*
          path: releases
          merge-multiple: true
      - name: Test native Linux launcher against published role images
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          export RELAY_ROLE_ONLINE_IMAGE=$(jq -r .image "releases/online-$ARCH.json")
          export RELAY_ROLE_OFFLINE_IMAGE=$(jq -r .image "releases/offline-$ARCH.json")
          export RELAY_ROLE_PLATFORM="linux/$ARCH"
          docker pull "$RELAY_ROLE_ONLINE_IMAGE"
          docker pull "$RELAY_ROLE_OFFLINE_IMAGE"
          go test ./cmd/relay -run 'TestDockerRoleImages|TestGuidedDockerOpen' -count=1 -v

  release-manifest:
    needs: [build, launchers, docker-smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          path: releases
          merge-multiple: true
      - name: Create approved platform-to-digest map
        shell: bash
        run: |
          set -euo pipefail
          jq -s --arg commit '${{ env.RELAY_COMMIT }}' \
            'map(select(.source_commit == $commit)) as $images |
             ($images | map(.source_commit) | unique) as $commits |
             if ($images | length) == 6 and ($commits | length) == 1 then
               {schema:"relay-role-image-release/v1", approval:"github-attested-ci", source_commit:$commits[0], launcher_commit:$commits[0],
                images:($images | sort_by(.target,.platform))}
             else error("incomplete or inconsistent image release records") end' \
            releases/*.json > relay-role-images.release.json
      - name: Attest release-map provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: relay-role-images.release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relay-role-images-release
          path: relay-role-images.release.json
          if-no-files-found: error
          retention-days: 90

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: native-launchers
          path: launchers
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELAY_COMMIT }}
          name: Role images ${{ env.RELEASE_TAG }}
          body: GitHub-attested CI role-image release for protected-main commit `${{ env.RELAY_COMMIT }}`.
          files: |
            relay-role-images.release.json
            launchers/*
